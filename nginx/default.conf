# Serves the static page and forwards /api/ to the FastAPI container.
# Because the page and the API then share one origin (localhost:3000), the
# browser needs no CORS rules for our own API. (Keycloak's token endpoint is a
# different origin; that is what the client's "Web Origins" setting is for.)

server {
    listen 80;
    root /usr/share/nginx/html;

    # A learning project: always serve the latest file you just edited.
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
    }
}
